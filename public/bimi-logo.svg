<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gold background -->
  <rect width="100" height="100" rx="0" fill="#d4a853"/>

  <!-- Stacked SP monogram -->
  <g fill="none" stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">

    <!-- Shared vertical spine (left edge, connecting S to P) -->
    <line x1="30" y1="15" x2="30" y2="86" stroke-width="6"/>

    <!-- S (top half) -->
    <!-- Top bar -->
    <line x1="30" y1="15" x2="62" y2="15" stroke-width="6"/>
    <!-- S middle connector going right -->
    <line x1="30" y1="38" x2="62" y2="38" stroke-width="6"/>
    <!-- S right side top-to-middle -->
    <line x1="62" y1="15" x2="62" y2="38" stroke-width="6"/>

    <!-- S lower section -->
    <line x1="30" y1="50" x2="62" y2="50" stroke-width="6"/>
    <!-- Inner horizontal for S bottom -->
    <line x1="30" y1="38" x2="30" y2="50" stroke-width="6"/>

    <!-- P (bottom half) -->
    <!-- P top bar -->
    <line x1="30" y1="58" x2="58" y2="58" stroke-width="6"/>
    <!-- P bump right side -->
    <path d="M 58,58 C 72,58 72,74 58,74" stroke-width="6"/>
    <!-- P middle bar (closing the bump) -->
    <line x1="30" y1="74" x2="58" y2="74" stroke-width="6"/>
    <!-- P bottom bar -->
    <line x1="30" y1="86" x2="30" y2="86" stroke-width="6"/>
  </g>
</svg>
